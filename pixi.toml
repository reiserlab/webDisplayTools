[workspace]
authors = ["Frank Loesche <loeschef@janelia.hhmi.org>"]
channels = ["conda-forge"]
name = "g6-webdisplaytools"
platforms = ["linux-64", "osx-arm64", "win-64", "osx-64"]
version = "0.1.0"

# The bridge/sim print non-ASCII (→, ⇄) to stderr; without this, Python on Windows
# picks cp1252 when stdio is a pipe (Git Bash, editors) and dies with UnicodeEncodeError.
[activation.env]
PYTHONUTF8 = "1"

[tasks]
# ── FicTrac closed-loop bridge (see fictrac-bridge/README.md) ───────────────
# Forward args after `--`, e.g.  pixi run bridge -- --proto tcp --frames 60 --log run.jsonl
bridge = "python fictrac-bridge/bridge.py"
sim = "python fictrac-bridge/fictrac_sim.py"
serve = "python -m http.server 8000 --bind 127.0.0.1"

# ── JS dev tooling (Node + Prettier come from conda-forge — no npm) ─────────
# The full test suite. yaml is vendored (js/vendor/yaml), so no package install.
# The v3 suite pulls in ESM modules that `import 'yaml'`; --import maps that bare
# specifier to the vendored copy (tests/vendor-yaml.register.mjs).
# Every tests/test-*.js|py and tests/validate-*.js, discovered by name (scripts/run-tests.py).
# A new test only needs the naming convention; no shared list to edit, so PRs stop conflicting here.
# pixi run test -- <substring…> runs a subset; -- --list shows what would run.
test = "python scripts/run-tests.py"
# ── Two-tier releases: Production + Next (docs/development/release-process.md) ──
# pixi run candidate -- 219 178   build a frozen Next candidate from those PRs
# pixi run release                 promote the validated candidate to Production
# pixi run tiers -- status | validate --rig R --by WHO | rollback --to release-…
# pixi run next-preview            assemble both tiers into _site/ locally
tiers = "python scripts/tiers/candidate.py"
candidate = "python scripts/tiers/candidate.py build"
release = "python scripts/tiers/candidate.py release"
next-preview = "python scripts/tiers/stamp.py preview"
# pixi run bench-check -- LOG [--hold COND=FRAME …] [--channel next] [--build SHA]   check a bench-validation run
bench-check = "python scripts/bench-check.py"
test-tiers = "python tests/test-tiers-candidate.py"
# Headless-Chrome smoke of arena_studio.html (layout, themes, contrast, console errors).
# Needs a local Chrome/Edge, so it is NOT part of `test` / CI. Args pass through (--compare origin/main).
studio-smoke = "python scripts/studio-smoke/studio_smoke.py"
format = "prettier --write \"**/*.js\""
format-check = "prettier --check \"**/*.js\""

[dependencies]
python = ">=3.10"
websockets = ">=12"  # closed-loop bridge; on conda-forge → conda dep, not pypi
nodejs = ">=22.12"   # JS test runner; require() of the ESM yaml build needs >=22.12
prettier = ">=3.8"   # JS formatter (replaces the npm devDependency)
gh = ">=2.101.0,<3"      # release tooling (scripts/tiers/candidate.py) — `gh auth login` once
