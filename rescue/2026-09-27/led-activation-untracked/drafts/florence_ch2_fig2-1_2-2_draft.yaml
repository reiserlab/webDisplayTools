            - [ 0, 124 ]
            - [ 175, 199 ]
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          gain: *cl_gain
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "train_unc_o270_p90" # cool 125..174, start frame 0
    commands:
      - type: "controller"
        command_name: "allOff"
      - type: "controller"
        command_name: "ledDrive"
        percent: *led_percent
      - type: "wait"
        duration: *dark_dur
      - type: "controller"
        command_name: "trialParams"
        pattern: "G6_2x10_florence_sbd_v1"
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
        led_activation:
          level: *led_percent
          hysteresis: *led_hysteresis
          on_ranges:
            - [ 0, 124 ]
            - [ 175, 199 ]
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          gain: *cl_gain
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  # ---- shutdown (L459-460: close_tcp, LED off) ---------------------------------
  # Do NOT disconnect the bridge — the run-log export runs after the sequence.
  - name: "shutdown"
    commands:
      - type: "controller"
        command_name: "ledDrive"
        percent: 0
      - type: "controller"
        command_name: "stopDisplay"
      - type: "controller"
        command_name: "allOff"
