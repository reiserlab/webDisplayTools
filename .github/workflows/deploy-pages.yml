# Deploy BOTH tiers to GitHub Pages as ONE artifact (docs/development/release-process.md):
#   /        Production — the tree of main (or of `root_ref`, emergency rollback only)
#   /next/   Next       — the frozen release candidate the `next` branch points at,
#                         or a placeholder page when no candidate is live
#
# Triggers: every push to main (Production changed), and workflow_dispatch — which is how
# `pixi run candidate` publishes a new candidate (`--ref main -f next=<sha>`) and how
# `pixi run tiers -- rollback` serves an older release. Never use pull_request_target here:
# it is blocked by default on public repos from 2026-11-02, and dispatching from main keeps
# the trusted workflow + the main-only `github-pages` environment rule.
name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            next:
                description: 'Next tier: a candidate commit SHA, "auto" (the next branch) or "none" (placeholder)'
                required: false
                default: 'auto'
            root_ref:
                description: 'EMERGENCY ROLLBACK ONLY: a release-… tag or main commit to serve at the site root'
                required: false
                default: ''

# Sets permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment
concurrency:
    group: 'pages'
    cancel-in-progress: false

# build and deploy are SEPARATE jobs on purpose: deploy-pages@v4 hard-fails if
# a run holds more than one "github-pages" artifact, so a re-run of a combined
# job (which re-uploads) can never succeed. Split, "Re-run failed jobs" after a
# transient Pages error re-runs only deploy — the single artifact is reused.
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout (full history — the build archives the candidate and tags)
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Pages
              uses: actions/configure-pages@v6
              with:
                  enablement: true

            # Resolves every input to a commit ONCE, archives root → _site/ and the
            # candidate → _site/next/, stamps the build identity into each page, and
            # self-checks that Production is byte-identical to its commit apart from the
            # stamp. A Next problem never blocks Production (placeholder instead).
            # Inputs go through env, never interpolated into the script.
            - name: Assemble Production + Next
              env:
                  NEXT_INPUT: ${{ inputs.next || 'auto' }}
                  ROOT_REF: ${{ inputs.root_ref }}
              run: |
                  if [ -n "$ROOT_REF" ]; then
                      git merge-base --is-ancestor "$ROOT_REF" origin/main \
                          || { echo "root_ref $ROOT_REF is not on main's history"; exit 1; }
                  fi
                  python3 scripts/tiers/stamp.py build --out _site \
                      --root-ref "${ROOT_REF:-$GITHUB_SHA}" --next "$NEXT_INPUT"

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: _site

    deploy:
        needs: build
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
