# ros2-poc — ROS 2 bridge proof of concept (LAB-303, decision in flight).
#
# A SEPARATE pixi workspace from the repo root one on purpose: the root `pixi.toml`
# (bridge 3.4, tests, release tooling) stays untouched, and the two environments
# live side by side on a rig PC — `pixi run bridge` at the root is the shipping
# bridge, `pixi run rig` here is the PoC graph.
#
#   pixi install          # RoboStack Jazzy (ros-base) + rmw_zenoh + our Python deps
#   pixi run rig          # Zenoh router + fictrac adapter + bridge node (one command)
#
# Channels: RoboStack publishes ROS 2 as conda packages; conda-forge first so the
# non-ROS stack (python, websockets, pyzmq) resolves from there. Bare channel names
# resolve through pixi's default channel alias (conda.anaconda.org), which is what
# a lab network with an allowlisting proxy is most likely to permit.
[workspace]
name = "arena-ros2-poc"
version = "0.1.0"
channels = ["conda-forge", "robostack-jazzy"]
platforms = ["osx-arm64", "win-64", "linux-64"]
# pixi-build (preview): `pixi install` builds interfaces/arena_interfaces (our .msg types) as a
# conda package with the RoboStack pixi-build-ros backend. On Windows that build needs MSVC 2022
# on the machine (the cost LAB-303 Plan B records); everything else is downloaded as before.
preview = ["pixi-build"]

[activation.env]
# Every ROS 2 process in this workspace uses the Zenoh middleware. rmw_zenoh needs
# ONE router per host (`pixi run router`); nodes keep retrying until it is up.
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
ZENOH_ROUTER_CHECK_ATTEMPTS = "0"
# Loopback-only Zenoh: the stock rmw_zenoh configs listen on `tcp/[::]:7447` (fails on a
# host without IPv6) and connect to `tcp/localhost:7447`. Ours bind/connect 127.0.0.1 —
# a rig PC's graph is not reachable from the lab network. Stock files with ONLY the two
# endpoint lines changed (diff them against share/rmw_zenoh_cpp/config/ in the env).
ZENOH_ROUTER_CONFIG_URI = "$PIXI_PROJECT_ROOT/config/zenoh-router.json5"
ZENOH_SESSION_CONFIG_URI = "$PIXI_PROJECT_ROOT/config/zenoh-session.json5"
# Same reason as the root workspace: the adapters print non-ASCII to stderr and
# Python on Windows would pick cp1252 when stdio is a pipe.
PYTHONUTF8 = "1"

[dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-rmw-zenoh-cpp = "*"
# The canonical talker/listener smoke test (`ros2 run demo_nodes_py …`); not part of ros-base.
ros-jazzy-demo-nodes-py = "*"
python = "*"
websockets = ">=12"
pyzmq = "*"
# ── Plan B spike (LAB-303): MCAP as the record of truth ─────────────────────
# rosbag2's Python API + the MCAP storage plugin record every topic per run
# (nodes/recorder.py); the pure-Python `mcap` reader converts a bag — or a
# crash-truncated one — back to the behavior_v2 NDJSON (nodes/mcap_convert.py)
# without needing a ROS process.
ros-jazzy-rosbag2-py = "*"
ros-jazzy-rosbag2-storage-mcap = "*"
mcap = ">=1.2"
# Typed messages (FicTracFrame, ArenaFrame, ConnectorReply): built from source by pixi itself,
# see interfaces/arena_interfaces/pixi.toml. `pixi run build-interfaces` is the colcon
# alternative (same package, same toolchain below) for a machine where the preview misbehaves.
arena_interfaces = { path = "interfaces/arena_interfaces" }
# ── typed messages (interfaces/arena_interfaces): the ament_cmake toolchain ──
# rosidl generates C typesupport + a Python C extension, so an interfaces
# package needs a C/C++ compiler on EVERY machine that builds it (MSVC on
# Windows). `pixi run build-interfaces` measures exactly that cost.
ros-jazzy-ament-cmake = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-rosidl-default-runtime = "*"
ros-jazzy-ros-environment = "*"
colcon-common-extensions = "*"
cmake = "*"
ninja = "*"
cxx-compiler = "*"

[tasks]
# ── hour one: middleware bring-up ───────────────────────────────────────────
router = "ros2 run rmw_zenoh_cpp rmw_zenohd"
talker = "ros2 run demo_nodes_py talker"
listener = "ros2 run demo_nodes_py listener"
# ── adapters (device programs → ROS topics; no custom message types) ────────
fictrac-adapter = "python nodes/fictrac_udp_adapter.py"
kinefly-adapter = "python nodes/kinefly_udp_adapter.py"
bias-node = "python nodes/bias_node.py"
bias-cmd = "python nodes/bias_cmd.py"
# ── the bridge node: bridge.py's hub + log writer + dispatcher on ROS input ──
bridge-node = "python nodes/bridge_node.py"
# ── simulators (the root workspace's fictrac_sim.py, unmodified) ────────────
sim = "python ../fictrac-bridge/fictrac_sim.py"
kinefly-sim = "python nodes/kinefly_sim.py"
bias-sim = "python nodes/bias_sim.py"
# ── the one command a rig runs ──────────────────────────────────────────────
rig = "python nodes/rig.py"
# ── acceptance test (LAB-303 PoC criteria): whole graph + Studio emulator + model fly ──
test = "python tests/test_ros2_poc.py"
studio-emulator = "python tests/studio_emulator.py"
# ── Plan B spike: MCAP record + converter + typed interfaces ──────────────────
# bag → behavior_v2 NDJSON (also `-- --level behavior_v1|full`, `-- --order time`);
# reads a crash-truncated bag too (`-- --recover`).
convert = "python nodes/mcap_convert.py"
# Build interfaces/arena_interfaces (FicTracFrame, ArenaFrame, ConnectorReply) with
# colcon inside this env; timed and recorded in README.md → "Plan B spike".
build-interfaces = "python nodes/build_interfaces.py"
