# rig — the ARENA rig's ROS 2 workspace (LAB-303): the Studio gateway, the arena composition and the
# arena visualization, on top of the shared rig-nodes package set. Renamed from `ros2-poc/` on
# 2026-10-26; the shared part (interfaces, device adapters + simulators, recorder, supervision,
# benches) moved to reiserlab/rig-nodes the same day (docs/development/rig-software-repos-and-runners.md
# §3.3, LAB-338) and is INSTALLED here as the `rig_nodes` (+ optional `rig_interfaces`) packages.
#
# A SEPARATE pixi workspace from the repo root one on purpose: the root `pixi.toml`
# (bridge 3.4, tests, release tooling) stays untouched, and the two environments
# live side by side on a rig PC — `pixi run bridge` at the root is the legacy
# bridge, `pixi run rig` here is the graph.
#
#   pixi install          # RoboStack Jazzy (ros-base) + rmw_zenoh + rosbag2/MCAP + rig_nodes (from the rig-nodes channel)
#   pixi run rig          # Zenoh router + fictrac adapter + bridge node (one command)
#   pixi install -e typed # + rig_interfaces: typed /fictrac/frame + /arena/frame (same solve group, one RoboStack set)
#   pixi install -e dev   # rig-nodes `main` (git source, pinned in pixi.lock) built from source instead of the channel
#   pixi install -e lyrical  # the migration rehearsal: ROS 2 Lyrical Luth (RoboStack, Python 3.14) + rig-nodes built from git
#
# THE ROS DISTRIBUTION IS ONE SWITCH (rig-nodes docs/ros-distro-switch.md, 2026-11-05): `[feature.jazzy]`
# and `[feature.lyrical]` below each carry a RoboStack channel, the `ros2-distro-mutex` pin, the Python
# pin, that distro's spelling of the ROS packages and the Zenoh config paths; every environment
# includes exactly one of them. The environments the rigs install (default / typed / viz) are
# `jazzy` + the channel pin and resolve to the same packages as before the switch.
#
# Channels: RoboStack publishes ROS 2 as conda packages; conda-forge first so the non-ROS stack
# (python, websockets, pyzmq) resolves from there, each distro feature's RoboStack channel next
# (`priority = -1`: a feature's channels otherwise go in FRONT of the workspace's), the rig-nodes
# channel last (`priority = -2`, in the `channel` feature). Bare channel names resolve through
# pixi's default channel alias (conda.anaconda.org), which is what a lab network with an
# allowlisting proxy is most likely to permit. The rig-nodes channel is read over
# raw.githubusercontent.com pinned to a RELEASE TAG of that repository (its channel/ directory
# holds the payload on the tagged commit only; git history serves the URL).
[workspace]
name = "rig"
version = "0.1.0"
channels = ["conda-forge"]
# rmw_zenoh ≥ 0.2.11 (the RoboStack 0.19 set) is built for macOS ≥ 14; without this floor the
# osx-arm64 solve falls back to the 0.16 set and the platforms drift apart (rig-nodes pins 0.19).
# Declared on the platform (pixi ≥ 0.80 virtual packages), not as the deprecated [system-requirements]; pixi
# requires an entry carrying virtual packages to have a `name` distinct from its subdir, and this is the name
# pixi 0.80 itself wrote on ww18 when it rewrote the 0.69 lock (#280).
platforms = [{ name = "osx-arm64-macos-14-0", platform = "osx-arm64", macos = "14.0" }, "win-64", "linux-64"]
preview = ["pixi-build"]
# An older pixi must refuse rather than rewrite pixi.lock in an older format: the lock is written by
# pixi ≥ 0.80 (issue #280 — ww18 on 0.80 rewrote a 0.69 lock in place, 1095 lines, and left the checkout
# dirty). Rigs install with `pixi install --locked`.
requires-pixi = ">=0.80"

# The rig-nodes source packages (`dev`, `lyrical`) leave their `ros2-distro-mutex` unpinned since
# rig-nodes#8; this ONE variant value pins their host solve to the set the environment uses — a
# disjunction every channel narrows to its own (robostack-jazzy also carries 0.20, the Python 3.14
# rebuild, which an unpinned solve would take). One value, not a list: pixi solves every listed
# variant in every environment, and `0.22.*` has no Jazzy candidate. Same line as rig-nodes' own
# workspace; a new RoboStack set is one more alternative here + a `[feature.<distro>]` below.
[workspace.build-variants]
ros2-distro-mutex = ["0.19.*|0.22.*"]

[activation.env]
# Every ROS 2 process in this workspace uses the Zenoh middleware. rmw_zenoh needs
# ONE router per host (`pixi run router`); nodes keep retrying until it is up.
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
ZENOH_ROUTER_CHECK_ATTEMPTS = "0"
# Loopback-only Zenoh: the stock rmw_zenoh configs listen on `tcp/[::]:7447` (fails on a host
# without IPv6) and connect to `tcp/localhost:7447`; the rig-nodes configs bind/connect 127.0.0.1 —
# a rig PC's graph is not reachable from the lab network. The two json5 files ship INSIDE the
# installed rig_nodes package (rig_nodes/zenoh.py applies them as defaults to every node that
# imports rig_nodes._common, and rig.py sets them for its children); these lines only make
# `ros2 topic echo` and friends in this workspace use them too. The site-packages path carries
# the Python version, so the two URIs live in the distro features below (3.12 → jazzy, 3.14 → lyrical).
# Same reason as the root workspace: the adapters print non-ASCII to stderr and
# Python on Windows would pick cp1252 when stdio is a pipe.
PYTHONUTF8 = "1"

# Windows: pixi builds the activation as a cmd.exe script, so a `$CONDA_PREFIX` value stays literal
# there while `%CONDA_PREFIX%` expands under `pixi run` (ww18 2026-10-15, for `$PIXI_PROJECT_ROOT`).
# The win-64 spelling of the two Zenoh URIs therefore lives NEXT TO each distro feature's POSIX
# spelling, as `[feature.<distro>.target.win-64.activation.env]`: a feature's activation env beats a
# WORKSPACE-level `[target.win-64.activation.env]` (ww18 2026-11-05: with the override here at the
# workspace level, every environment on Windows got the literal `$CONDA_PREFIX/lib/python3.x/…` and
# no router could start). The Windows path carries no Python version, so both features spell it alike.

# ── distro-neutral: in every environment ────────────────────────────────────
[dependencies]
websockets = ">=12"
pyzmq = "*"
# the pure-Python `mcap` reader converts a bag — or a crash-truncated one — back to the behavior_v2
# NDJSON (nodes/mcap_convert.py) without a ROS process (MCAP as the record of truth, LAB-303 Plan B)
mcap = ">=1.2"

# ── THE switch: one feature per RoboStack set ────────────────────────────────
# jazzy — ONE RoboStack set, pinned (2026-10-26): the set the rig-nodes packages were built against.
# The mutex decides which RoboStack Jazzy rebuild every ros-jazzy-* package comes from. 0.19 +
# Python 3.12 is what the rigs run; the channel's rig_interfaces pins the same, so a rig gets one set.
[feature.jazzy]
channels = [{ channel = "robostack-jazzy", priority = -1 }]

[feature.jazzy.dependencies]
ros2-distro-mutex = "0.19.*"
python = "3.12.*"
ros-jazzy-ros-base = "*"
ros-jazzy-rmw-zenoh-cpp = "*"
# The canonical talker/listener smoke test (`ros2 run demo_nodes_py …`); not part of ros-base.
ros-jazzy-demo-nodes-py = "*"
# rosbag2's Python API + the MCAP storage plugin record every topic per run (rig_nodes.recorder,
# driven by nodes/bridge_node.py).
ros-jazzy-rosbag2-py = "*"
ros-jazzy-rosbag2-storage-mcap = "*"

[feature.jazzy.activation.env]
ZENOH_ROUTER_CONFIG_URI = "$CONDA_PREFIX/lib/python3.12/site-packages/rig_nodes/config/zenoh-router.json5"
ZENOH_SESSION_CONFIG_URI = "$CONDA_PREFIX/lib/python3.12/site-packages/rig_nodes/config/zenoh-session.json5"

[feature.jazzy.target.win-64.activation.env]
ZENOH_ROUTER_CONFIG_URI = '%CONDA_PREFIX%\Lib\site-packages\rig_nodes\config\zenoh-router.json5'
ZENOH_SESSION_CONFIG_URI = '%CONDA_PREFIX%\Lib\site-packages\rig_nodes\config\zenoh-session.json5'

# lyrical — ROS 2 Lyrical Luth from RoboStack (mutex 0.22, Python 3.14, rmw_zenoh ≥ 0.10.6), the
# rehearsal of the next distribution; no rig installs it. The published rig-nodes channel is
# Jazzy-only (its packages pin mutex 0.19), so this environment builds rig_nodes + rig_interfaces
# from the rig-nodes git source (`main`, pinned to one commit in pixi.lock like `dev`; rig-nodes#8
# merged 2026-11-05). What the rehearsal found and what still blocks a migration: rig-nodes
# docs/ros-distro-switch.md.
[feature.lyrical]
channels = [{ channel = "robostack-lyrical", priority = -1 }]

[feature.lyrical.dependencies]
ros2-distro-mutex = "0.22.*"
python = "3.14.*"
ros-lyrical-ros-base = "*"
ros-lyrical-rmw-zenoh-cpp = ">=0.10.6"
ros-lyrical-demo-nodes-py = "*"
ros-lyrical-rosbag2-py = "*"
ros-lyrical-rosbag2-storage-mcap = "*"
rig_nodes = { git = "https://github.com/reiserlab/rig-nodes", branch = "main", subdirectory = "src/rig_nodes" }
rig_interfaces = { git = "https://github.com/reiserlab/rig-nodes", branch = "main", subdirectory = "src/rig_interfaces" }

[feature.lyrical.activation.env]
ZENOH_ROUTER_CONFIG_URI = "$CONDA_PREFIX/lib/python3.14/site-packages/rig_nodes/config/zenoh-router.json5"
ZENOH_SESSION_CONFIG_URI = "$CONDA_PREFIX/lib/python3.14/site-packages/rig_nodes/config/zenoh-session.json5"

[feature.lyrical.target.win-64.activation.env]
ZENOH_ROUTER_CONFIG_URI = '%CONDA_PREFIX%\Lib\site-packages\rig_nodes\config\zenoh-router.json5'
ZENOH_SESSION_CONFIG_URI = '%CONDA_PREFIX%\Lib\site-packages\rig_nodes\config\zenoh-session.json5'
# ── the shared rig-nodes package set, pinned (one version for the set; README "Releasing") ──
# Device adapters (FicTrac, Kinefly, BIAS) and their simulators, the MCAP recorder and indexer, the CDR
# decoder, the Foxglove rewriter (+ bias_health), the host monitor, the supervision primitives rig.py composes
# with. 0.3.0 (2026-10-28) added the HostStats message set for the host monitor (rig_interfaces, `typed`
# environment); 0.4.0 (same day) moved the ScanImage JSON connector to the private 2P rig repo and made the
# host monitor's typed floats compressible + its process sampling cheaper (rig-nodes#4, #6).
# Written into every run's record by the gateway (hello_ack + /arena/session `packages`). The pin lives in the
# `channel` feature (default / typed / viz), not in [dependencies]: the `dev` environment builds rig_nodes from
# the git source instead, and one package name from two sources does not solve once the released version is
# ahead of `main` (0.3.0 vs 0.2.1 on 2026-10-28: "excluded because of strict channel priority").
# The channel is read at the RELEASE TAG (`v0.4.0`, rig-nodes#7), the preferred form; 0.3.0 was pinned by the
# payload commit's SHA only because its tag had first landed one commit before the payload.
[feature.channel]
channels = [{ channel = "https://raw.githubusercontent.com/reiserlab/rig-nodes/v0.4.0/channel", priority = -2 }]

[feature.channel.dependencies]
rig_nodes = "==0.4.0"

# ── typed messages = the OPT-IN `typed` environment ───────────────────────────────────────
# `pixi install -e typed` adds rig_interfaces (FicTracFrame, ArenaFrame, ConnectorReply, HostStats + its
# DiskStats/NetStats/GpuStats/ProcStats records) from the
# SAME channel, built in rig-nodes' CI for win-64 / osx-arm64 / linux-64 — no compiler, no build
# backend, no MAX_PATH (docs in rig-nodes: docs/typed-distribution-decision.md). Same solve group
# as the default environment: since the package pins the 0.19 set too, the two environments share
# one RoboStack set (the 0.2.0 build did not — rig-nodes channel/README.md). Kept OUT of the default
# environment so the rigs keep recording String topics until typed recording is decided for them;
# the nodes fall back on their own (`--typed auto`).
[feature.typed.dependencies]
rig_interfaces = "==0.4.0"

# ── developer path: rig-nodes `main`, built from source (git source dependencies) ────────────
# `pixi install -e dev` swaps the two channel pins for the HEAD of reiserlab/rig-nodes `main`,
# built with pixi-build from a git checkout and pinned to ONE commit in pixi.lock
# (`pixi update -e dev rig_nodes rig_interfaces` moves it), so a node fix merged in rig-nodes is
# tested here before a package-set release (rig-software-repos-and-runners.md §7 item 6).
# NOT path dependencies on a sibling checkout (as until 2026-10-27): pixi validates every
# environment's source PATHS before installing ANY environment, so a missing `../../rig-nodes`
# broke `pixi install` on every rig PC. Git sources are only fetched when `dev` itself is
# installed — the default/typed environments install offline with no git cache (verified
# 2026-10-27, pixi 0.69). To test an UNPUSHED rig-nodes change, point the two lines below at your
# checkout — `{ path = "../../rig-nodes/src/rig_nodes" }` / `{ … /src/rig_interfaces" }` — and do
# not commit that manifest/lock change. Cache gotcha: a source build of the SAME version as the
# release lands in pixi's package cache under the release's filename (an editable path build is a
# 25-file stub) and shadows a later channel install on that machine — remove the
# `rig_nodes-<ver>-*` entry under `pixi info`'s cache dir, or build a version main has bumped past
# the tag. pixi-build resolves each package's own build + host environment (the rosidl toolchain,
# the compilers) from the environment's channels; nothing of that is declared here (verified by the
# `lyrical` environment's build on 2026-11-05, which lists no toolchain either). The distro comes
# from the `jazzy` feature beside this one: pixi-build-ros reads the `robostack-<distro>` channel.
# Own solve group: the default/typed locks are untouched.
[feature.dev.dependencies]
rig_nodes = { git = "https://github.com/reiserlab/rig-nodes", branch = "main", subdirectory = "src/rig_nodes" }
rig_interfaces = { git = "https://github.com/reiserlab/rig-nodes", branch = "main", subdirectory = "src/rig_interfaces" }

# ── seeing the graph = the OPT-IN `viz` environment ──────────────────────────
# `pixi install -e viz`: rqt_graph (live node/topic graph, Qt), rqt_topic / rqt_console, and
# foxglove_bridge (Foxglove Studio connects to ws://localhost:8766 for live plots; Foxglove
# also opens our runlogs/*.bag MCAP files offline with no bridge at all). Kept out of the
# default environment: Qt + the bridge add ~0.3 GB a rig does not need to run. Jazzy-only: these
# names carry the distro; a Lyrical viz is the same four lines spelled `ros-lyrical-*` when needed.
[feature.viz.dependencies]
ros-jazzy-rqt-graph = "*"
ros-jazzy-rqt-topic = "*"
ros-jazzy-rqt-console = "*"
ros-jazzy-foxglove-bridge = "*"

# Windows: the foxglove-bridge package puts foxglove.dll + foxglove_cpp_shared.dll in Library\lib,
# which is not on the DLL search path, so `ros2 run foxglove_bridge` exits 0xC0000135 (DLL not
# found; ww14 2026-10-22). Prepend that directory for the viz environment only.
[feature.viz.target.win-64.activation.env]
PATH = '%CONDA_PREFIX%\Library\lib;%PATH%'

# The Lyrical graph's foxglove_bridge: a Jazzy bridge cannot join a Lyrical router (different
# rmw_zenoh), so `rig.py --foxglove` on the lyrical environment needs a bridge from the same set
# (ww18 2026-11-05, finding L2 of the Lyrical bench). Same solve group as `lyrical`, so the two
# environments share one package set; rqt stays Jazzy-only (`viz`).
[feature.lyrical-viz.dependencies]
ros-lyrical-foxglove-bridge = "*"

[feature.lyrical-viz.target.win-64.activation.env]
PATH = '%CONDA_PREFIX%\Library\lib;%PATH%'

[environments]
default = { features = ["jazzy", "channel"], solve-group = "rig" }
typed = { features = ["jazzy", "channel", "typed"], solve-group = "rig" }
viz = { features = ["jazzy", "channel", "viz"], solve-group = "rig" }
# `dev` without the `typed` feature: `typed` pins rig_interfaces to the released version from the channel, while
# `dev` builds it from the git source — one name from two sources does not solve once the release is ahead of
# `main` (0.3.0 vs 0.2.1 on 2026-10-28, "excluded because of strict channel priority"). The git source IS the
# typed package here, so nothing is lost.
dev = { features = ["jazzy", "dev"], solve-group = "dev" }
# the next distribution, built from the rig-nodes git source (see `[feature.lyrical]`); own solve group
lyrical = { features = ["lyrical"], solve-group = "lyrical" }
lyrical-viz = { features = ["lyrical", "lyrical-viz"], solve-group = "lyrical" }

[tasks]
# ── hour one: middleware bring-up ───────────────────────────────────────────
router = "rig-router"
talker = "ros2 run demo_nodes_py talker"
listener = "ros2 run demo_nodes_py listener"
# ── device adapters + command tools (rig_nodes console scripts) ─────────────
fictrac-adapter = "rig-fictrac-adapter"
kinefly-adapter = "rig-kinefly-adapter"
bias-node = "rig-bias-node"
bias-cmd = "rig-bias-cmd"
backlight-node = "rig-backlight-node"
backlight-cmd = "rig-backlight-cmd"
# ── the bridge node (this rig's gateway): bridge.py's hub + log writer + dispatcher on ROS input ──
bridge-node = "python nodes/bridge_node.py"
# ── simulators (rig_nodes.sims) ────────────────────────────────────────────
sim = "rig-fictrac-sim"
kinefly-sim = "rig-kinefly-sim"
bias-sim = "rig-bias-sim"
backlight-sim = "rig-backlight-sim"
# ── the one command a rig runs ──────────────────────────────────────────────
rig = "python nodes/rig.py"
# ── acceptance test (LAB-303 PoC criteria): whole graph + Studio emulator + model fly ──
# This is also the cross-repository smoke for the installed rig-nodes package set (record §7.8).
test = "python tests/test_ros2_poc.py"
# hours of the graph with the Studio emulator knocking every few minutes (`-- --hours 8 --every 10`,
# `--fictrac` for a real FicTrac); results in runlogs/soak-<stamp>/ — rig/LYRICAL-BENCH.md
soak = "python tests/soak_graph.py"
# the gateway records + derives the 2P rig's topics (its SiPM / frame-stream nodes are private: scanimage-2026-bergamo 2p-rig-nodes/)
test-gateway = "python tests/test_gateway_registration.py"
studio-emulator = "python tests/studio_emulator.py"
# ── MCAP record + converter ──────────────────────────────────────────────────
# bag → behavior_v2 NDJSON (also `-- --level behavior_v1|full`, `-- --order time`);
# reads a crash-truncated bag too (`-- --recover`).
convert = "python nodes/mcap_convert.py"
# Ask the RUNNING bridge node for its log (the Studio's own log_export message): closes
# the run's bag + file and writes the converted NDJSON. For rigs without a course token
# (the Studio only exports when it commits to the course repo).
export = "python nodes/export_log.py"
# Rewrite a finished bag indexed + zstd-compressed (the bridge does this itself when a run
# closes cleanly; use it on a bag recorded before that, or after `--recover`).
reindex = "rig-reindex"
# Is the typed package usable in THIS environment (imports AND serializes)?
check-typed = "python -m rig_nodes.build_interfaces --check"
# ── seeing the graph ─────────────────────────────────────────────────────────
# The live graph as Mermaid (default), DOT (`-- --dot`) or a table with rates (`-- --text`);
# works in every environment while `pixi run rig` is up.
graph = "rig-graph"
# Foxglove dashboards: the typed republisher (plots/3D markers from the JSON streams; `pixi run rig -- --foxglove` starts it with foxglove_bridge), its unit test, and the offline String-bag → plottable-MCAP converter with the arena derivations
viz = "python nodes/viz_node.py"
test-viz = "python tests/test_viz_node.py"
fox-json = "python nodes/foxglove_json.py"
# The camera + G6 dashboard (foxglove/arena-okey-cokey.json): the live expected/observed display +
# arena health node (`pixi run rig -- --stimulus`), and its unit test (pure; also runs the JS
# panel-color module under the root env's Node to pin the Python port)
stimulus = "python nodes/stimulus_node.py"
test-stimulus = "python tests/test_stimulus.py"
test-stimulus-live = "python tests/test_stimulus_live.py"
# `viz` environment only (`pixi run -e viz …`): the interactive views.
rqt-graph = "rqt_graph"
rqt-topic = "rqt_topic"
foxglove-bridge = "ros2 run foxglove_bridge foxglove_bridge --ros-args -p port:=8766 -p address:=127.0.0.1"
# ── the five-minute release validation (rig/QC.md): `pixi run qc -- --tier next [--rig ww18] [--auto]` ──
# Checks out the tier's build in a scratch worktree with its own environment, runs the graph, the Studio
# emulator pre-check, the tier's Studio in Chrome, the reports, and prints a validation note.
qc = "python qc/qc.py"
