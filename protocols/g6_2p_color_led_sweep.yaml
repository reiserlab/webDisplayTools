        frame_index: 0
        frame_rate: *fps
        gain: 0
        duty: *duty_c
      - type: "wait"
        duration: *step_dur
  - name: "violet_d63"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: *pat_violet
        pattern_ID: *id_violet
        duration: *step_dur
        mode: 2
        frame_index: 0
        frame_rate: *fps
        gain: 0
        duty: *duty_d
      - type: "wait"
        duration: *step_dur
  - name: "violet_d127"
