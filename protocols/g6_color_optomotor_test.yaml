version: 3

# ============================================================================
# Color optomotor test — G6 2×10 four-color arena, web runner, BIAS camera
# (okey-cokey / visual motion centering rig: freely walking flies, no FicTrac).
#
# Modeled on the G4.1 MATLAB protocols 11 and 13 (Reiser Lab, 2026-04-21): open-loop
# rotating square-wave gratings, clockwise then counterclockwise, one video for the run.
# What changes here:
#   * ONE LED color at a time. The four-color G6 panels put four colors in each 2×2 pixel
#     cell; each pattern lights only one color's pixels, on the TOP panel row only
#     (protocols/g6_color_optomotor_test_patterns/, built by
#     scripts/make-color-optomotor-patterns.js). Bank 0 violet 405 nm, 1 blue 470 nm,
#     2 green 525 nm, 3 yellow-orange 590 nm.
#   * ONE spatial period (20 px = 36°), ONE speed (frame_rate 80 → 4 Hz temporal
#     frequency, the originals' 4 Hz).
#   * Brightness by the per-trial `duty` override (fw #33, web-only): 25 %, 50 %, 100 %
#     of 255 — one block per duty, the four colors inside, 2 repetitions.
#   * No backlight, no thermometer (not driven by the web runner; turn the IR backlight on
#     by hand). The camera plugin (BiasPlugin) IS driven by the web runner through the
#     bridge's BIAS connector (Studio v0.95+, LAB-303): startRecording / getTimestamp /
#     stopRecording run.
#
# TRIAL SHAPE (Grace, 2026-10-21): each trial is a CW/CCW PAIR — 15 s clockwise, then
# 15 s counterclockwise with NO pause between them, then 10 s dark before the next pair
# (also across block boundaries). The reversal is phase-continuous: 15 s × 80 frames/s =
# 1200 frames = a whole number of 20-frame periods, so CW ends on frame 0, where CCW
# starts. The camera timestamp is taken at the start of each pair (in the dark), never
# between CW and CCW, so its round trip cannot stretch the clockwise half.
#
# TIMING: 3 duties × 4 colors × 2 repetitions = 24 pairs × 30 s = 12 min of stimulus,
# plus 24 × 10 s of dark between pairs and the 5 s pre-dark → ~16 min. For ~8 min set
# `repetitions: 1` on each block. All knobs are in `variables:`; keep rot_dur × 80 a
# multiple of 20 (rot_dur a multiple of 0.25 s) to keep the reversal phase-continuous.
#
# DIRECTION: frame_rate +80 steps the pattern toward increasing column index; on the
# four-color arena that is clockwise seen from above (confirmed on the smoke run,
# ww18 2026-10-15). If a rig shows it reversed, swap the fps_cw / fps_ccw values.
#
# BEFORE RUNNING: upload the patterns folder from the Console (Patterns → Add ▾), check
# the SD listing shows the four names with 20 frames; BIAS must be running with its
# external-control server on (port 5010 for camera 0) and its logging format set to
# ufmf (BIAS writes the format configured in its own settings; the filename below asks
# for .ufmf). The bias node's --video-dir decides where a relative filename lands.
# ============================================================================

experiment_info:
  name: "Color optomotor test — one LED color at a time, top row, CW/CCW pairs, duty sweep"
  author: "Reiser Lab"

rig: "./configs/rigs/cshl_g6_2x10.yaml"

plugins:
  - name: "camera"
    type: "class"
    matlab:
      class: "BiasPlugin"

variables:
  rot_dur: &rot_dur 15            # s — each rotation (CW, then CCW): trialParams duration AND its wait
  pause_dur: &pause_dur 10        # s — dark between CW/CCW pairs
  pre_dark: &pre_dark 5           # s — dark before the first pair (originals: 300 s adaptation)
  fps_cw: &fps_cw 80              # frames/s = 4 Hz temporal frequency at 20 px per period
  fps_ccw: &fps_ccw -80
  duty_25: &duty_25 64            # 25 % of 255
  duty_50: &duty_50 128           # 50 %
  duty_100: &duty_100 255         # 100 %

experiment:
  - "cam_start"
  - name: "duty_25_block"
    trials: ["violet_pair_d25", "blue_pair_d25", "green_pair_d25", "yellow_pair_d25"]
    repetitions: 2
    intertrial: "dark_pause"
  - "dark_pause"              # keep the 10 s pause across the block boundary
  - name: "duty_50_block"
    trials: ["violet_pair_d50", "blue_pair_d50", "green_pair_d50", "yellow_pair_d50"]
    repetitions: 2
    intertrial: "dark_pause"
  - "dark_pause"              # keep the 10 s pause across the block boundary
  - name: "duty_100_block"
    trials: ["violet_pair_d100", "blue_pair_d100", "green_pair_d100", "yellow_pair_d100"]
    repetitions: 2
    intertrial: "dark_pause"
  - "cam_stop"                # its own 10 s dark, then stopRecording

conditions:
  # ── camera bracket (one ufmf for the whole run) ─────────────────────────────
  - name: "cam_start"
    commands:
      - type: "plugin"
        plugin_name: "camera"
        command_name: "connect"
      - type: "plugin"
        plugin_name: "camera"
        command_name: "startRecording"
        params:
          filename: "color_optomotor.ufmf"
      - type: "controller"
        command_name: "allOff"
      - type: "wait"
        duration: *pre_dark
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"

  - name: "cam_stop"
    commands:
      - type: "controller"
        command_name: "allOff"
      - type: "wait"
        duration: *pause_dur
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"
      - type: "plugin"
        plugin_name: "camera"
        command_name: "stopRecording"

  - name: "dark_pause"
    commands:
      - type: "controller"
        command_name: "allOff"
      - type: "wait"
        duration: *pause_dur

  # ── duty 25 % ────────────────────────────────────────────────────────────────
  - name: "violet_pair_d25"
    commands:
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"
      - type: "controller"
        command_name: "trialParams"
        pattern: "G6_2x10_toprow_grat20_violet"
        pattern_ID: 1
        duration: *rot_dur
        mode: 2
        frame_index: 0
        frame_rate: *fps_cw
        gain: 0
        duty: *duty_25
      - type: "wait"
        duration: *rot_dur
      - type: "controller"
        command_name: "trialParams"
        pattern: "G6_2x10_toprow_grat20_violet"
        pattern_ID: 1
        duration: *rot_dur
        mode: 2
        frame_index: 0
        frame_rate: *fps_ccw
