version: 3

# ============================================================================
# Closed-loop COUPLING × BIAS — a first test on a real fly (web runner, Mode 3)
#
# Needs Arena Studio v0.85+ and bridge 3.3+ (`pixi run bridge` prints the version).
# Pattern: the built-in 200-frame full-azimuth rotation on the G6 2×10 card:
#   4  frame2_h_ccw_200f   (1 frame = 1 azimuth pixel = 1.8°, the pitch the rig supplies)
#
# WHAT IT TESTS, in three blocks of 20 s closed-loop trials with a 5 s dark ITI:
#
#   A. coupling — how much the display turns per turn of the ball, no disturbance:
#        1     the natural closed loop (the display follows the ball 1:1)
#        0.75  the world turns LESS than the ball (an under-compensating world)
#        1.25  the world turns MORE than the ball
#       -1     reversed — the classic sanity check (the fly should NOT stabilize)
#      With bridge 3.3 a fractional coupling is seamless: watch the display for the
#      once-per-revolution jump the old `gain` produced — there must be none.
#
#   B. bias at coupling 1 — a gentle disturbance the fly should counter-turn:
#        constant  ±30 °/s   (one revolution every 12 s; ~17 frames/s)
#        sine      30 °/s @ 0.25 Hz  → position swings ±19°
#        sine      60 °/s @ 0.5 Hz   → ±19° twice as fast
#        square    30 °/s @ 0.25 Hz  → triangle in position, ±30°
#      A positive amplitude turns the display CLOCKWISE from above (pattern sweeps
#      rightward across the fly's view). The bias is defined in display degrees and is
#      NOT scaled by the coupling.
#
#   C. bias × coupling:
#        coupling 0.75 + constant 30 °/s — rejection with a weaker loop
#        coupling 0    + constant 30 °/s — OPEN-LOOP REPLAY: the display ignores the fly
#                                          and just drifts; the control for block B
#
# ≈ 10 min total (22 trials × 25 s + two 20 s baselines). Everything is bound to the
# variables below — shorten `cl_dur` for a first look.
#
# READOUT: `pixi run python scripts/closed-loop-report.py <run.jsonl.gz> --svg cl.svg`
# gives, per trial, the fly's turning, where the feature sat (frontal fraction), the
# reconstructed bias and a REJECTION index (1 = fully counter-turned the bias, 0 =
# ignored it). Expect: high frontal fraction at coupling 1, none at −1; rejection well
# above 0 on block B; ≈ 0 rejection and a steady drift on the coupling-0 control.
#
# Dry run without a fly: `pixi run sim -- --model fly --kp 2` (docs/development/
# model-fly-bench.md) — the model fly fixates, so it exercises every block.
# Web-only: MATLAB has no FicTracPlugin.
# ============================================================================

experiment_info:
  name: "Closed-loop coupling × bias — fly test"
  author: "webDisplayTools"

rig: "./configs/rigs/cshl_g6_2x10_ball.yaml"

plugins:
  - name: "fictrac"
    type: "class"
    matlab:
      class: "FicTracPlugin"
    config:
      bridge_url: "ws://localhost:8765"
      fictrac_port: 60000
      proto: "udp"
      offset: 0

variables:
  # ── durations (drive trialParams duration AND the closed-loop wait together) ──
  cl_dur: &cl_dur 20 # seconds per closed-loop trial
  iti_dur: &iti_dur 5 # dark inter-trial interval, s
  # ── couplings ────────────────────────────────────────────────────────────────
  k_under: &k_under 0.75 # the world turns 0.75× the ball
  k_over: &k_over 1.25 # the world turns 1.25× the ball
  # ── disturbances (peak velocity deg/s, frequency Hz) — gentle on purpose ─────
  amp_slow: &amp_slow 30 # 30 deg/s: one revolution per 12 s
  amp_fast: &amp_fast 60 # 60 deg/s at twice the frequency = the same ±19° excursion
  f_slow: &f_slow 0.25 # Hz — one back-and-forth every 4 s
  f_fast: &f_fast 0.5 # Hz

experiment:
  - "cl_baseline"
  - name: "A_coupling"
    trials:
      - "cl_k1"
      - "cl_k075"
      - "cl_k125"
      - "cl_kneg1"
    repetitions: 2
    randomize: true
    intertrial: "dark_iti"
  - name: "B_bias_at_k1"
    trials:
      - "cl_bias_const_pos"
      - "cl_bias_const_neg"
      - "cl_bias_sine_slow"
      - "cl_bias_sine_fast"
      - "cl_bias_square"
    repetitions: 2
    randomize: true
    intertrial: "dark_iti"
  - name: "C_bias_x_coupling"
    trials:
      - "cl_k075_bias_const"
      - "cl_k0_bias_const"
    repetitions: 2
    randomize: true
    intertrial: "dark_iti"
  - "cl_baseline"
  - "shutdown"

conditions:
  # NOTE: no explicit fictrac connect/disconnect — the runner auto-connects the bridge
  # at run start and the run log is exported from the bridge AFTER the sequence, so a
  # protocol-level disconnect would lose the log.

  # ---- baseline: natural closed loop, no disturbance -------------------------
  - name: "cl_baseline"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: 1
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  # ---- A. coupling sweep -------------------------------------------------------
  - name: "cl_k1"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: 1
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cl_k075"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: *k_under
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cl_k125"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: *k_over
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cl_kneg1"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: -1
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  # ---- B. bias at coupling 1 ---------------------------------------------------
  - name: "cl_bias_const_pos"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: 1
          bias_type: "constant"
          bias_amplitude: *amp_slow
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cl_bias_const_neg"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: 1
          bias_type: "constant"
          bias_amplitude: -30 # counter-clockwise (negate the amplitude, never the frequency)
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cl_bias_sine_slow"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: 1
          bias_type: "sine"
          bias_amplitude: *amp_slow
          bias_frequency: *f_slow
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cl_bias_sine_fast"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: 1
          bias_type: "sine"
          bias_amplitude: *amp_fast
          bias_frequency: *f_fast
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cl_bias_square"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: 1
          bias_type: "square"
          bias_amplitude: *amp_slow
          bias_frequency: *f_slow
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  # ---- C. bias × coupling ------------------------------------------------------
  - name: "cl_k075_bias_const"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: *k_under
          bias_type: "constant"
          bias_amplitude: *amp_slow
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  # The control: coupling 0 = the display ignores the fly and simply drifts at 30 °/s.
  - name: "cl_k0_bias_const"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          coupling: 0
          bias_type: "constant"
          bias_amplitude: *amp_slow
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  # ---- dark ITI ------------------------------------------------------------------
  - name: "dark_iti"
    commands:
      - type: "controller"
        command_name: "allOff"
      - type: "wait"
        duration: *iti_dur

  # ---- shutdown ------------------------------------------------------------------
  - name: "shutdown"
    commands:
      - type: "controller"
        command_name: "stopDisplay"
      - type: "controller"
        command_name: "allOff"
