version: 3
# ww18 SOAK variant (2026-10-15): both closed-loop epochs 300 s (~10 min run).
# ww18 variant (2026-10-15): the site library's G6 2x10 rotating square grating, SD slot 2
# (patterns/g6_2x10/patterns/002_grating_sq.pat, 20 frames), in place of the Mac bench card's
# G6_2x10_grat_rot_20px_50pct_4c-B-Y. Otherwise identical to bias_camera_closed_loop_poc.yaml.

# BIAS camera + FicTrac closed loop through the ROS 2 bridge node (LAB-303 connectors).
# The `camera` plugin (BiasPlugin) is driven by the WEB runner: each command goes to the
# bridge as connector_command, the bridge's BIAS node runs it over BIAS's HTTP port, and
# the reply (with the video artifact for startRecording) lands in the run log.
#
#   cam_start : connect → startRecording (one video for the whole run) → getTimestamp
#   2 closed-loop trials (none, then a constant +90°/s bias), 15 s each
#   cam_sync  : getTimestamp (a mid-run sync point against the bridge clock)
#   cam_stop  : getTimestamp → stopRecording
#
# Video path: relative to the bias node's --video-dir (like MATLAB's experiment folder).

experiment_info:
  name: "BIAS camera + closed loop — ROS 2 PoC, Windows rig ww18, 10-min soak (2 x 300 s closed loop) (LAB-303)"
  author: "webDisplayTools"

rig: "./configs/rigs/cshl_g6_2x10_ball.yaml"

plugins:
  - name: "fictrac"
    type: "class"
    matlab:
      class: "FicTracPlugin"
    config:
      bridge_url: "ws://localhost:8765"
      fictrac_port: 60000
      proto: "udp"
      offset: 0
  - name: "camera"
    type: "class"
    matlab:
      class: "BiasPlugin"

variables:
  cl_dur: &cl_dur 300

experiment:
  - name: "camera_run"
    trials:
      - "cam_start"
      - "cl_bias_none"
      - "cam_sync"
      - "cl_bias_constant"
      - "cam_stop"
    repetitions: 1
  - "shutdown"

conditions:
  - name: "cam_start"
    commands:
      - type: "plugin"
        plugin_name: "camera"
        command_name: "connect"
      - type: "plugin"
        plugin_name: "camera"
        command_name: "startRecording"
        params:
          filename: "poc_studio_run.avi"
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"
      - type: "wait"
        duration: 1

  - name: "cl_bias_none"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "grating_sq"
        pattern_ID: 2
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          bias_type: "none"
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cam_sync"
    commands:
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"
      - type: "wait"
        duration: 1

  - name: "cl_bias_constant"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "grating_sq"
        pattern_ID: 2
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          bias_type: "constant"
          bias_amplitude: 90
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cam_stop"
    commands:
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"
      - type: "plugin"
        plugin_name: "camera"
        command_name: "stopRecording"
      - type: "wait"
        duration: 1

  - name: "shutdown"
    commands:
      - type: "controller"
        command_name: "stopDisplay"
      - type: "controller"
        command_name: "allOff"
