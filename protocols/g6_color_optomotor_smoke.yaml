version: 3

# ============================================================================
# SMOKE variant of g6_color_optomotor_test.yaml — same patterns, same CW/CCW pair shape
# (CW then CCW with no pause, dark between pairs), cut to ~2 minutes: 10 s per rotation,
# 5 s dark between pairs, the four colors at duty 100 % only, one repetition, camera
# bracket as in the full protocol. For checking a rig (patterns on the card, direction,
# BIAS recording) before the full ~16-minute run. 10 s × 80 frames/s = 800 frames, a
# whole number of 20-frame periods, so the reversal is phase-continuous here too.
# ============================================================================

experiment_info:
  name: "Color optomotor SMOKE — CW/CCW pairs, 10 s per rotation, duty 100 %, BIAS check"
  author: "Reiser Lab"

rig: "./configs/rigs/cshl_g6_2x10.yaml"

plugins:
  - name: "camera"
    type: "class"
    matlab:
      class: "BiasPlugin"

variables:
  rot_dur: &rot_dur 10            # s — each rotation (CW, then CCW): trialParams duration AND its wait
  pause_dur: &pause_dur 5         # s — dark between CW/CCW pairs
  pre_dark: &pre_dark 2           # s — dark before the first pair (originals: 300 s adaptation)
  fps_cw: &fps_cw 80              # frames/s = 4 Hz temporal frequency at 20 px per period
  fps_ccw: &fps_ccw -80
  duty_100: &duty_100 255         # 100 %

experiment:
  - "cam_start"
  - name: "duty_100_block"
    trials: ["violet_pair_d100", "blue_pair_d100", "green_pair_d100", "yellow_pair_d100"]
    repetitions: 1
    intertrial: "dark_pause"
  - "cam_stop"                # its own 10 s dark, then stopRecording

conditions:
  # ── camera bracket (one ufmf for the whole run) ─────────────────────────────
  - name: "cam_start"
    commands:
      - type: "plugin"
        plugin_name: "camera"
        command_name: "connect"
      - type: "plugin"
        plugin_name: "camera"
        command_name: "startRecording"
        params:
          filename: "color_optomotor_smoke.ufmf"
      - type: "controller"
        command_name: "allOff"
      - type: "wait"
        duration: *pre_dark
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"

  - name: "cam_stop"
    commands:
      - type: "controller"
        command_name: "allOff"
      - type: "wait"
        duration: *pause_dur
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"
      - type: "plugin"
        plugin_name: "camera"
        command_name: "stopRecording"

  - name: "dark_pause"
    commands:
      - type: "controller"
        command_name: "allOff"
      - type: "wait"
        duration: *pause_dur

  # ── duty 100 % ───────────────────────────────────────────────────────────────
  - name: "violet_pair_d100"
    commands:
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"
      - type: "controller"
        command_name: "trialParams"
        pattern: "G6_2x10_toprow_grat20_violet"
        pattern_ID: 1
        duration: *rot_dur
        mode: 2
        frame_index: 0
        frame_rate: *fps_cw
        gain: 0
        duty: *duty_100
      - type: "wait"
        duration: *rot_dur
      - type: "controller"
        command_name: "trialParams"
        pattern: "G6_2x10_toprow_grat20_violet"
        pattern_ID: 1
        duration: *rot_dur
        mode: 2
        frame_index: 0
        frame_rate: *fps_ccw
        gain: 0
        duty: *duty_100
      - type: "wait"
        duration: *rot_dur

  - name: "blue_pair_d100"
    commands:
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"
      - type: "controller"
        command_name: "trialParams"
        pattern: "G6_2x10_toprow_grat20_blue"
        pattern_ID: 2
        duration: *rot_dur
        mode: 2
        frame_index: 0
        frame_rate: *fps_cw
        gain: 0
        duty: *duty_100
      - type: "wait"
        duration: *rot_dur
      - type: "controller"
        command_name: "trialParams"
        pattern: "G6_2x10_toprow_grat20_blue"
        pattern_ID: 2
        duration: *rot_dur
        mode: 2
        frame_index: 0
        frame_rate: *fps_ccw
        gain: 0
        duty: *duty_100
      - type: "wait"
        duration: *rot_dur

  - name: "green_pair_d100"
    commands:
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"
      - type: "controller"
        command_name: "trialParams"
        pattern: "G6_2x10_toprow_grat20_green"
        pattern_ID: 3
        duration: *rot_dur
        mode: 2
        frame_index: 0
        frame_rate: *fps_cw
        gain: 0
        duty: *duty_100
      - type: "wait"
        duration: *rot_dur
      - type: "controller"
        command_name: "trialParams"
        pattern: "G6_2x10_toprow_grat20_green"
        pattern_ID: 3
        duration: *rot_dur
        mode: 2
        frame_index: 0
        frame_rate: *fps_ccw
        gain: 0
        duty: *duty_100
      - type: "wait"
        duration: *rot_dur

  - name: "yellow_pair_d100"
    commands:
      - type: "plugin"
        plugin_name: "camera"
        command_name: "getTimestamp"
      - type: "controller"
        command_name: "trialParams"
        pattern: "G6_2x10_toprow_grat20_yellow"
        pattern_ID: 4
        duration: *rot_dur
        mode: 2
        frame_index: 0
        frame_rate: *fps_cw
        gain: 0
        duty: *duty_100
      - type: "wait"
        duration: *rot_dur
      - type: "controller"
        command_name: "trialParams"
        pattern: "G6_2x10_toprow_grat20_yellow"
        pattern_ID: 4
        duration: *rot_dur
        mode: 2
        frame_index: 0
        frame_rate: *fps_ccw
        gain: 0
        duty: *duty_100
      - type: "wait"
        duration: *rot_dur
