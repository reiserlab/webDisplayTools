version: 3

# ============================================================================
# One-trial Mode-3 drill — for the recovery drill before an overnight soak and
# for the lab's injected-stall test (lab-test-day-windows-2026-09-14.md, test B):
# a single 60 s closed-loop trial on the 813 KB bar with the simulator, nothing
# else. Run it as a Test run; the banner at the end is the result.
#   before:  await Studio.setSdDiag(3)      (inject the stall arm)
#   after:   await Studio.setSdDiag(0)
# ============================================================================

experiment_info:
  name: "Mode-3 drill (one 60 s bar trial)"
  author: "webDisplayTools"

rig: "./configs/rigs/cshl_g6_2x10_ball.yaml"

plugins:
  - name: "fictrac"
    type: "class"
    matlab:
      class: "FicTracPlugin"
    config:
      bridge_url: "ws://localhost:8765"
      fictrac_port: 60000
      proto: "udp"
      gain: 1.8
      offset: 0

experiment:
  - "drill_setup"
  - "cl_bar_200f"
  - "drill_shutdown"

conditions:
  - name: "drill_setup"
    commands:
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "connect"

  - name: "cl_bar_200f"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: 60
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          gain: 1.8
      - type: "wait"
        duration: 60
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "drill_shutdown"
    commands:
      - type: "controller"
        command_name: "stopDisplay"
