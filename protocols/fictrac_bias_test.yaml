version: 3

# ============================================================================
# FicTrac closed-loop BIAS (disturbance) test — web runner only.
#
# A "bias" is a smooth disturbance added to the closed loop, so the display
# keeps rotating even when the fly holds still. Sweeping it lets you measure how
# well the fly REJECTS the disturbance (does it counter-turn to null the motion?).
#
# Uses ONLY built-in g6_2x10 patterns already on the SD card:
#   4 frame2_h_ccw_200f  (a 200-frame full-azimuth rotation)
#
# The bias is authored as an added rotational VELOCITY in deg/s (`bias_amplitude`
# = the PEAK velocity), which the bridge integrates into a bias ANGLE and folds
# into its heading→frame-index mapping. So at gain 1.8 (= 360/200), a bias of
# 90 deg/s advances the display 90°/s = 50 frames/s.
#
#   bias_type   what the display does (with a still fly)
#   none        nothing — the plain closed-loop baseline
#   constant    rotates steadily, one direction, forever
#   sine        swings smoothly back and forth over ±A/(2πf)
#   square      constant-speed rotation that reverses, over ±A/(4f)
#
# DIRECTION (confirmed on the arena, 2026-08-04, at the normal positive gain 1.8):
# a POSITIVE bias_amplitude turns the display CLOCKWISE — equivalently, the pattern
# sweeps rightward across the fly's visual field. Negative is counter-clockwise.
# This is the sign your analysis must assume; get it backwards and a fly correctly
# counter-turning against the disturbance will read as following it.
#
# The periodic waveforms are ZERO-MEAN in position: the display is pushed equally
# left and right rather than drifting to one side, and always starts at the frame
# it was already on (no jump at onset). Note the excursion SHRINKS as frequency
# rises for a fixed amplitude — at 90 deg/s the sine covers ±28.6° at 0.5 Hz but
# only ±14.3° at 1 Hz. Full semantics: docs/development/closed-loop-bias.md.
#
# DURATION knobs (`variables:` below): cl_dur drives every trial's trialParams
# duration AND its bracketing wait, so they always move together.
#
# TIMING — the `wait` is load-bearing in every condition here: it holds the
# closed loop ACTIVE for cl_dur before stopClosedLoop fires. Drop it and the
# stop fires immediately, so no disturbance would ever be seen.
#
# Total ≈ 4 min at defaults (8 trials × 30 s). Needs the FicTrac bridge
# (`pixi run bridge`); with no fly, `pixi run sim` supplies synthetic heading.
# NOTE (web-first): MATLAB has no FicTracPlugin (its closed loop is analog
# Mode 4, computed on the controller, where the host cannot inject a bias), so
# this protocol runs on the WEB runner only.
# ============================================================================

experiment_info:
  name: "FicTrac closed-loop bias (disturbance) test"
  author: "webDisplayTools"

rig: "./configs/rigs/cshl_g6_2x10_ball.yaml"

plugins:
  - name: "fictrac"
    type: "class"
    matlab:
      class: "FicTracPlugin"
    config:
      bridge_url: "ws://localhost:8765"
      fictrac_port: 60000
      proto: "udp"
      gain: 1.8
      offset: 0

variables:
  # ── Duration knob ──────────────────────────────────────────────────────────
  cl_dur: &cl_dur 30 # seconds per closed-loop trial (drives duration AND wait)
  # ── Disturbance knobs ──────────────────────────────────────────────────────
  # amp is the PEAK velocity in deg/s; freq only applies to sine/square. Change
  # these once here (or in the Edit view's Variables panel) to rescale the sweep.
  bias_amp: &bias_amp 90 # 90 deg/s = 50 frames/s at gain 1.8
  bias_amp_slow: &bias_amp_slow 30 # a gentler disturbance for comparison
  bias_freq: &bias_freq 0.5 # Hz — one back-and-forth cycle every 2 s
  bias_freq_fast: &bias_freq_fast 1.0 # Hz — halves the position excursion

experiment:
  - name: "bias_sweep"
    trials:
      - "cl_bias_none"
      - "cl_bias_constant"
      - "cl_bias_constant_rev"
      - "cl_bias_sine"
      - "cl_bias_sine_fast"
      - "cl_bias_sine_slow"
      - "cl_bias_square"
      - "cl_bias_square_fast"
    repetitions: 1
  - "shutdown"

conditions:
  # NOTE: no explicit fictrac connect/disconnect. The runner auto-connects the
  # bridge at run start, and must NOT disconnect it at the end — the recorded-run
  # log is exported from the bridge AFTER the sequence finishes, so a
  # protocol-level disconnect would close the bridge before the log commits.

  # ---- baseline: closed loop with NO disturbance ------------------------------
  # The control condition. Omitting bias_type entirely is equivalent to
  # bias_type "none"; it is spelled out here so the contrast is obvious.
  - name: "cl_bias_none"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          gain: 1.8
          bias_type: "none"
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  # ---- constant: a steady drift the fly must walk against --------------------
  # bias_frequency is ignored by `constant` (there is no period), so it is omitted.
  # NEGATE bias_amplitude to reverse the direction — negating the FREQUENCY does
  # nothing, because the waveform is even in frequency.
  - name: "cl_bias_constant"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          gain: 1.8
          bias_type: "constant"
          bias_amplitude: *bias_amp
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cl_bias_constant_rev"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          gain: 1.8
          bias_type: "constant"
          bias_amplitude: -90
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  # ---- sine: the classic frequency-response disturbance ----------------------
  # Position excursion is ±A/(2πf): ±28.6° at 90 deg/s + 0.5 Hz, ±14.3° at 1 Hz.
  - name: "cl_bias_sine"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          gain: 1.8
          bias_type: "sine"
          bias_amplitude: *bias_amp
          bias_frequency: *bias_freq
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cl_bias_sine_fast"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          gain: 1.8
          bias_type: "sine"
          bias_amplitude: *bias_amp
          bias_frequency: *bias_freq_fast
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cl_bias_sine_slow"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          gain: 1.8
          bias_type: "sine"
          bias_amplitude: *bias_amp_slow
          bias_frequency: *bias_freq
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  # ---- square: constant-speed rotation that reverses -------------------------
  # Position is a symmetric triangle spanning ±A/(4f): ±45° at 90 deg/s + 0.5 Hz.
  - name: "cl_bias_square"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          gain: 1.8
          bias_type: "square"
          bias_amplitude: *bias_amp
          bias_frequency: *bias_freq
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  - name: "cl_bias_square_fast"
    commands:
      - type: "controller"
        command_name: "trialParams"
        pattern: "frame2_h_ccw_200f"
        pattern_ID: 4
        duration: *cl_dur
        mode: 3
        frame_index: 0
        frame_rate: 0
        gain: 0
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "startClosedLoop"
        params:
          gain: 1.8
          bias_type: "square"
          bias_amplitude: *bias_amp
          bias_frequency: *bias_freq_fast
      - type: "wait"
        duration: *cl_dur
      - type: "plugin"
        plugin_name: "fictrac"
        command_name: "stopClosedLoop"

  # ---- shutdown --------------------------------------------------------------
  # Blank the arena only. Do NOT disconnect the bridge here — the run-log export
  # runs after the sequence, and needs the bridge still connected.
  - name: "shutdown"
    commands:
      - type: "controller"
        command_name: "stopDisplay"
      - type: "controller"
        command_name: "allOff"
